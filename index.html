<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>HWTA DESERT WORLD V6</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#b9a078;
font-family:Arial,sans-serif;
}

canvas{
display:block;
}

#title{
position:absolute;
top:8px;
left:50%;
transform:translateX(-50%);
color:white;
font-weight:bold;
font-size:15px;
text-shadow:2px 2px 5px black;
z-index:10;
white-space:nowrap;
}

#hud{
position:absolute;
top:35px;
left:10px;
background:#101b16dd;
color:white;
padding:8px 12px;
border-radius:9px;
font-size:11px;
line-height:1.8;
z-index:10;
}

#healthBox{
width:130px;
height:9px;
background:#333;
border-radius:10px;
overflow:hidden;
margin-top:3px;
}

#healthFill{
height:100%;
width:100%;
background:#36dc69;
transition:width .2s;
}

#enemyHealthBox{
position:absolute;
top:35px;
left:50%;
transform:translateX(-50%);
background:#171717dd;
padding:6px 12px;
border-radius:8px;
color:white;
font-size:11px;
display:none;
z-index:10;
}

#enemyHealthFill{
height:7px;
width:100%;
background:#ed4242;
border-radius:10px;
}

#enemyHealthTrack{
width:120px;
height:7px;
background:#333;
border-radius:10px;
margin-top:5px;
}

#weaponInfo{
position:absolute;
top:10px;
right:10px;
background:#17231ddd;
border:1px solid #ffffff66;
border-radius:9px;
color:white;
padding:8px 12px;
font-size:11px;
z-index:10;
}

#joystick{
position:absolute;
bottom:18px;
left:18px;
width:120px;
height:120px;
border-radius:50%;
background:#ffffff35;
border:2px solid #ffffff90;
z-index:20;
}

#stick{
position:absolute;
width:52px;
height:52px;
left:32px;
top:32px;
border-radius:50%;
background:#ffffffdd;
box-shadow:0 2px 8px #0006;
}

.btn{
position:absolute;
width:59px;
height:59px;
border-radius:50%;
border:2px solid #ffffffbb;
background:#202820e8;
color:white;
font-weight:bold;
font-size:10px;
z-index:20;
display:flex;
align-items:center;
justify-content:center;
}

.btn:active{
background:#657d43;
transform:scale(.94);
}

#jump{
right:18px;
bottom:175px;
}

#run{
right:88px;
bottom:110px;
}

#crouch{
right:18px;
bottom:105px;
}

#weapon{
right:88px;
bottom:35px;
}

#fire{
right:18px;
bottom:20px;
width:76px;
height:76px;
background:#a52b20e8;
font-size:13px;
border:3px solid #ffb2a5;
}

#aim{
right:110px;
bottom:195px;
background:#194a76e8;
}

#message{
position:absolute;
top:43%;
left:50%;
transform:translate(-50%,-50%);
background:#17231ddd;
color:white;
padding:13px 20px;
border-radius:10px;
display:none;
z-index:50;
text-align:center;
}

#crosshair{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:30px;
height:30px;
display:none;
z-index:15;
pointer-events:none;
}

#crosshair:before,
#crosshair:after{
content:"";
position:absolute;
background:#ffffff;
box-shadow:0 0 4px black;
}

#crosshair:before{
width:2px;
height:30px;
left:14px;
}

#crosshair:after{
height:2px;
width:30px;
top:14px;
}

#rotate{
display:none;
position:absolute;
inset:0;
background:#17221b;
color:white;
z-index:100;
align-items:center;
justify-content:center;
text-align:center;
font-size:21px;
}

#gameOver{
position:absolute;
inset:0;
background:#000c;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
z-index:90;
gap:15px;
}

#restart{
padding:12px 25px;
border:0;
border-radius:9px;
background:#b88b39;
color:white;
font-weight:bold;
font-size:16px;
}

@media(orientation:portrait){
#rotate{display:flex;}
}
</style>
</head>

<body>

<div id="title">HWTA DESERT WORLD V6</div>

<div id="hud">
HEALTH
<div id="healthBox">
<div id="healthFill"></div>
</div>
<span id="healthText">100 / 100</span>
<br>
REGION: DESERT<br>
STATUS: <span id="status">NORMAL</span><br>
EQUIPMENT: <span id="equipment">0</span><br>
ENEMIES: <span id="enemies">7</span>
</div>

<div id="enemyHealthBox">
ENEMY HEALTH
<div id="enemyHealthTrack">
<div id="enemyHealthFill"></div>
</div>
</div>

<div id="weaponInfo">
WEAPON: <span id="weaponName">ENERGY PISTOL</span>
</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="joystick">
<div id="stick"></div>
</div>

<button class="btn" id="jump">JUMP</button>
<button class="btn" id="run">RUN</button>
<button class="btn" id="crouch">CROUCH</button>
<button class="btn" id="weapon">WEAPON</button>
<button class="btn" id="aim">AIM</button>
<button class="btn" id="fire">FIRE</button>

<div id="rotate">
<div>
HWTA DESERT WORLD V6<br><br>
يرجى تدوير الهاتف للوضع الأفقي
</div>
</div>

<div id="gameOver">
<h1>GAME OVER</h1>
<p>انتهت الجولة</p>
<button id="restart">RESTART</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// =====================================
// ENGINE
// =====================================

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x91b9d0);

scene.fog=new THREE.Fog(0xc7ad84,100,850);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,1500
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

document.body.appendChild(renderer.domElement);

// =====================================
// LIGHTING
// =====================================

const sun=new THREE.DirectionalLight(0xffe4b5,2.5);

sun.position.set(-100,180,100);
sun.castShadow=true;

sun.shadow.mapSize.set(1024,1024);

scene.add(sun);

scene.add(new THREE.HemisphereLight(
0xd6edff,0x806044,1.6
));

// =====================================
// MATERIALS
// =====================================

const sand=new THREE.MeshStandardMaterial({
color:0xc7a36e,
roughness:1
});

const rock=new THREE.MeshStandardMaterial({
color:0x8e7658
});

const wall=new THREE.MeshStandardMaterial({
color:0xb69a74
});

const darkGreen=new THREE.MeshStandardMaterial({
color:0x29362a
});

const uniform=new THREE.MeshStandardMaterial({
color:0x526341
});

const camo1=new THREE.MeshStandardMaterial({
color:0x7c8954
});

const camo2=new THREE.MeshStandardMaterial({
color:0x303e2b
});

const skin=new THREE.MeshStandardMaterial({
color:0x987052
});

const black=new THREE.MeshStandardMaterial({
color:0x20231e
});

const helmetMat=new THREE.MeshStandardMaterial({
color:0x3e4d32
});

// =====================================
// GROUND
// =====================================

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1500,1500),
sand
);

ground.rotation.x=-Math.PI/2;
ground.position.y=-0.1;
ground.receiveShadow=true;

scene.add(ground);

// =====================================
// MOUNTAINS
// =====================================

for(let i=0;i<35;i++){

const size=35+Math.random()*65;
const height=60+Math.random()*100;

const mountain=new THREE.Mesh(
new THREE.ConeGeometry(size,height,7),
rock
);

mountain.position.set(
(Math.random()-.5)*1300,
height/2-3,
(Math.random()-.5)*1300
);

mountain.castShadow=true;

scene.add(mountain);

}

// =====================================
// DUNES
// =====================================

for(let i=0;i<55;i++){

const dune=new THREE.Mesh(
new THREE.SphereGeometry(1,12,8),
sand
);

dune.scale.set(
30+Math.random()*40,
4+Math.random()*7,
25+Math.random()*35
);

dune.position.set(
(Math.random()-.5)*1300,
-3,
(Math.random()-.5)*1300
);

scene.add(dune);

}

// =====================================
// BUILDINGS
// =====================================

const colliders=[];

function building(x,z,w,h,d,material){

const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
material
);

mesh.position.set(x,h/2,z);

mesh.castShadow=true;
mesh.receiveShadow=true;

scene.add(mesh);

colliders.push({
x,z,
halfX:w/2,
halfZ:d/2
});

}

for(let i=0;i<15;i++){

building(
-200+Math.random()*400,
-200+Math.random()*400,
12+Math.random()*10,
8+Math.random()*5,
12+Math.random()*10,
wall
);

}

building(220,150,40,12,35,darkGreen);
building(275,150,25,9,25,wall);
building(220,215,18,18,18,darkGreen);
building(170,215,20,8,25,wall);

// =====================================
// PART CREATOR
// =====================================

function part(parent,geometry,material,x,y,z){

const mesh=new THREE.Mesh(geometry,material);

mesh.position.set(x,y,z);

mesh.castShadow=true;
mesh.receiveShadow=true;

parent.add(mesh);

return mesh;

}

// =====================================
// SOLDIER CREATOR
// =====================================

function createSoldier(){

const soldier=new THREE.Group();

const body=new THREE.Group();

body.position.y=1.65;

soldier.add(body);

part(
body,
new THREE.CapsuleGeometry(0.43,0.75,5,12),
uniform,0,0.55,0
);

part(
body,
new THREE.BoxGeometry(1.05,0.85,0.7),
darkGreen,0,0.65,0.05
);

for(const x of [-0.36,0,0.36]){

part(
body,
new THREE.BoxGeometry(0.25,0.28,0.12),
uniform,x,0.7,0.42
);

}

for(let i=0;i<12;i++){

part(
body,
new THREE.BoxGeometry(0.15,0.1,0.03),
Math.random()>.5?camo1:camo2,
(Math.random()-.5)*.8,
0.2+Math.random()*.9,
0.36
);

}

part(
body,
new THREE.BoxGeometry(0.95,0.15,0.65),
black,0,0.05,0
);

part(
body,
new THREE.CylinderGeometry(.13,.15,.25,12),
skin,0,1.18,0
);

const head=new THREE.Group();

head.position.set(0,1.55,0);

body.add(head);

part(
head,
new THREE.SphereGeometry(.31,20,16),
skin,0,0,0
);

for(const x of [-.3,.3]){

part(
head,
new THREE.SphereGeometry(.075,10,8),
skin,x,0,0
);

}

for(const x of [-.12,.12]){

part(
head,
new THREE.SphereGeometry(.035,8,8),
black,x,.04,.285
);

}

const helmet=part(
head,
new THREE.SphereGeometry(.36,20,16),
helmetMat,0,.2,0
);

helmet.scale.set(1.12,.75,1.08);

part(
head,
new THREE.CylinderGeometry(.39,.39,.055,20),
darkGreen,0,.08,0
);

// BACKPACK

part(
body,
new THREE.BoxGeometry(.78,.9,.35),
darkGreen,0,.55,-.48
);

// ARMS

const leftArm=new THREE.Group();
const rightArm=new THREE.Group();

leftArm.position.set(-.66,.95,0);
rightArm.position.set(.66,.95,0);

body.add(leftArm,rightArm);

function createArm(parent){

part(
parent,
new THREE.CapsuleGeometry(.19,.55,5,10),
uniform,0,-.38,0
);

part(
parent,
new THREE.SphereGeometry(.15,10,8),
black,0,-.88,0
);

}

createArm(leftArm);
createArm(rightArm);

// LEGS

const leftLeg=new THREE.Group();
const rightLeg=new THREE.Group();

leftLeg.position.set(-.29,1.65,0);
rightLeg.position.set(.29,1.65,0);

soldier.add(leftLeg,rightLeg);

function createLeg(parent){

part(
parent,
new THREE.CapsuleGeometry(.23,.65,5,10),
uniform,0,-.43,0
);

part(
parent,
new THREE.BoxGeometry(.34,.24,.18),
darkGreen,0,-.82,.14
);

part(
parent,
new THREE.BoxGeometry(.4,.32,.62),
black,0,-1.05,.14
);

}

createLeg(leftLeg);
createLeg(rightLeg);

return{
group:soldier,
body,
leftArm,
rightArm,
leftLeg,
rightLeg
};

}

// =====================================
// PLAYER
// =====================================

const player=createSoldier();

scene.add(player.group);

player.group.position.set(0,0,0);

// =====================================
// WEAPON MODELS
// =====================================

const weaponMetal=new THREE.MeshStandardMaterial({
color:0x303631,
metalness:.65,
roughness:.4
});

const weaponGrip=new THREE.MeshStandardMaterial({
color:0x252922
});

function createPistol(){

const weapon=new THREE.Group();

part(
weapon,
new THREE.BoxGeometry(.16,.16,.42),
weaponMetal,0,0,0
);

part(
weapon,
new THREE.BoxGeometry(.13,.28,.13),
weaponGrip,0,-.19,.08
);

return weapon;

}

function createRifle(){

const weapon=new THREE.Group();

part(
weapon,
new THREE.BoxGeometry(.16,.16,.95),
weaponMetal,0,0,0
);

part(
weapon,
new THREE.BoxGeometry(.12,.12,.55),
weaponGrip,0,-.12,.35
);

part(
weapon,
new THREE.BoxGeometry(.14,.28,.16),
weaponGrip,0,-.2,.05
);

part(
weapon,
new THREE.CylinderGeometry(.035,.035,.5,8),
weaponMetal,0,0,.62
);

return weapon;

}

const pistol=createPistol();
const rifle=createRifle();

player.rightArm.add(pistol);

pistol.position.set(0,-.85,.3);

let currentWeapon=0;

function switchWeapon(){

currentWeapon=(currentWeapon+1)%2;

player.rightArm.remove(pistol);
player.rightArm.remove(rifle);

if(currentWeapon===0){

player.rightArm.add(pistol);
pistol.position.set(0,-.85,.3);

document.getElementById("weaponName")
.textContent="ENERGY PISTOL";

}else{

player.rightArm.add(rifle);
rifle.position.set(0,-.45,.15);

document.getElementById("weaponName")
.textContent="ENERGY RIFLE";

}

showMessage("WEAPON CHANGED");

}

// =====================================
// ENEMIES
// =====================================

const enemies=[];

function createEnemy(x,z,radius){

const model=createSoldier();

scene.add(model.group);

model.group.position.set(x,0,z);

// Enemy health indicator

const barGroup=new THREE.Group();

const barBack=new THREE.Mesh(
new THREE.PlaneGeometry(1.5,.13),
new THREE.MeshBasicMaterial({color:0x252525})
);

const barFill=new THREE.Mesh(
new THREE.PlaneGeometry(1.45,.09),
new THREE.MeshBasicMaterial({color:0x35dd55})
);

barFill.position.z=.01;

barGroup.add(barBack);
barGroup.add(barFill);

barGroup.position.y=4.1;

model.group.add(barGroup);

enemies.push({

model,
centerX:x,
centerZ:z,
radius,

angle:Math.random()*Math.PI*2,

speed:1.2+Math.random()*.6,

health:100,
maxHealth:100,

alert:false,

phase:Math.random()*10,

attackTimer:Math.random()*2,

barGroup,
barFill,

alive:true

});

}

createEnemy(100,80,18);
createEnemy(145,190,22);
createEnemy(250,90,20);
createEnemy(-120,100,25);
createEnemy(-180,-100,20);
createEnemy(300,250,25);
createEnemy(-250,200,20);

// =====================================
// CRATES
// =====================================

const crates=[];

function createCrate(x,z){

const group=new THREE.Group();

const box=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1.2,1.3),
new THREE.MeshStandardMaterial({color:0x4b5837})
);

box.position.y=.6;

group.add(box);

const stripe=new THREE.Mesh(
new THREE.BoxGeometry(1.55,.12,1.35),
new THREE.MeshStandardMaterial({color:0x202b20})
);

stripe.position.y=.65;

group.add(stripe);

group.position.set(x,0,z);

scene.add(group);

crates.push({
group,x,z,collected:false
});

}

createCrate(15,20);
createCrate(-60,90);
createCrate(190,80);
createCrate(260,190);
createCrate(-150,-130);
createCrate(350,300);
createCrate(-300,250);
createCrate(80,-180);

// =====================================
// GAME VARIABLES
// =====================================

const clock=new THREE.Clock();

let moveX=0;
let moveY=0;

let velocity=new THREE.Vector3();

let running=false;
let crouching=false;
let jumping=false;

let verticalSpeed=0;

let gaitTime=0;

let equipment=0;

let playerHealth=100;
let maxPlayerHealth=100;

let cameraAngle=0;

let cameraHeight=4;
let cameraDistance=8;

let aiming=false;
let firing=false;

let gameEnded=false;

let selectedEnemy=null;

const projectiles=[];

// =====================================
// MESSAGE
// =====================================

let messageTimer;

function showMessage(text){

const message=document.getElementById("message");

message.textContent=text;
message.style.display="block";

clearTimeout(messageTimer);

messageTimer=setTimeout(()=>{
message.style.display="none";
},1800);

}

// =====================================
// DISTANCE
// =====================================

function distance(x1,z1,x2,z2){

return Math.sqrt(
(x1-x2)**2+(z1-z2)**2
);

}

// =====================================
// COLLISION
// =====================================

function collides(x,z){

const radius=.65;

for(const box of colliders){

const closestX=THREE.MathUtils.clamp(
x,box.x-box.halfX,box.x+box.halfX
);

const closestZ=THREE.MathUtils.clamp(
z,box.z-box.halfZ,box.z+box.halfZ
);

const dx=x-closestX;
const dz=z-closestZ;

if(dx*dx+dz*dz<radius*radius){
return true;
}

}

return false;

}

// =====================================
// HEALTH UI
// =====================================

function updatePlayerHealth(){

const percent=Math.max(
0,playerHealth/maxPlayerHealth*100
);

document.getElementById("healthFill")
.style.width=percent+"%";

document.getElementById("healthText")
.textContent=
Math.ceil(playerHealth)+" / "+maxPlayerHealth;

document.getElementById("healthFill")
.style.background=
percent<30?"#e53935":
percent<60?"#e9b52e":"#36dc69";

}

function damagePlayer(amount){

if(gameEnded)return;

playerHealth=Math.max(0,playerHealth-amount);

updatePlayerHealth();

showMessage("PLAYER HIT! -"+amount);

if(playerHealth<=0){

gameEnded=true;

document.getElementById("gameOver")
.style.display="flex";

}

}

// =====================================
// ENEMY HEALTH
// =====================================

function damageEnemy(enemy,amount){

if(!enemy.alive)return;

enemy.health=Math.max(0,enemy.health-amount);

enemy.barFill.scale.x=Math.max(
.001,enemy.health/enemy.maxHealth
);

enemy.barFill.position.x=
-.72*(1-enemy.health/enemy.maxHealth);

enemy.barGroup.visible=true;

selectedEnemy=enemy;

document.getElementById("enemyHealthBox")
.style.display="block";

document.getElementById("enemyHealthFill")
.style.width=
(enemy.health/enemy.maxHealth*100)+"%";

if(enemy.health<=0){

enemy.alive=false;

scene.remove(enemy.model.group);

showMessage("ENEMY DEFEATED!");

document.getElementById("enemyHealthBox")
.style.display="none";

selectedEnemy=null;

updateEnemyCount();

}

}

function updateEnemyCount(){

const alive=enemies.filter(e=>e.alive).length;

document.getElementById("enemies")
.textContent=alive;

}

// =====================================
// ENERGY PROJECTILES
// =====================================

const blueEnergy=new THREE.MeshBasicMaterial({
color:0x22dfff
});

const redEnergy=new THREE.MeshBasicMaterial({
color:0xff3939
});

function createProjectile(position,direction,type){

const material=type==="enemy"?redEnergy:blueEnergy;

const mesh=new THREE.Mesh(
new THREE.SphereGeometry(.19,12,12),
material
);

mesh.position.copy(position);

scene.add(mesh);

const glow=new THREE.PointLight(
type==="enemy"?0xff3333:0x00cfff,
2,5
);

mesh.add(glow);

projectiles.push({

mesh,

velocity:direction.clone().normalize().multiplyScalar(
type==="enemy"?16:35
),

type,

life:3,

damage:type==="enemy"?8:
(currentWeapon===0?25:18)

});

}

// =====================================
// PLAYER FIRING
// =====================================

let fireCooldown=0;

function fireWeapon(){

if(gameEnded)return;

if(fireCooldown>0)return;

fireCooldown=currentWeapon===0?.35:.14;

const direction=new THREE.Vector3();

camera.getWorldDirection(direction);

const start=camera.position.clone()
.add(direction.clone().multiplyScalar(1.5));

createProjectile(start,direction,"player");

}

// =====================================
// ENEMY FIRING
// =====================================

function enemyFire(enemy){

const start=enemy.model.group.position.clone();

start.y+=2.4;

const target=player.group.position.clone();

target.y+=1.5;

const direction=target.sub(start).normalize();

createProjectile(start,direction,"enemy");

}

// =====================================
// PROJECTILE UPDATE
// =====================================

function updateProjectiles(delta){

for(let i=projectiles.length-1;i>=0;i--){

const p=projectiles[i];

p.mesh.position.addScaledVector(
p.velocity,delta
);

p.life-=delta;

let remove=false;

if(p.type==="player"){

for(const enemy of enemies){

if(!enemy.alive)continue;

const d=p.mesh.position.distanceTo(
enemy.model.group.position.clone().add(
new THREE.Vector3(0,1.6,0)
)
);

if(d<1.1){

damageEnemy(enemy,p.damage);

remove=true;

break;

}

}

}else{

const d=p.mesh.position.distanceTo(
player.group.position.clone().add(
new THREE.Vector3(0,1.5,0)
)
);

if(d<1){

damagePlayer(p.damage);

remove=true;

}

}
