<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>HWTA DESERT WORLD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#title {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
    z-index: 10;
}

#info {
    position: absolute;
    top: 40px;
    left: 12px;
    color: white;
    font-size: 11px;
    text-shadow: 2px 2px 4px black;
    z-index: 10;
}

#joystick {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #ffffff30;
    border: 2px solid #ffffff80;
    z-index: 20;
}

#stick {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 33px;
    top: 33px;
    border-radius: 50%;
    background: #ffffffbb;
}

.btn {
    position: absolute;
    right: 25px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid white;
    background: #222222aa;
    color: white;
    font-weight: bold;
    z-index: 20;
}

#jump { bottom: 105px; }
#run { bottom: 25px; }

#rotate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    background: #111;
    padding: 20px;
    text-align: center;
    z-index: 100;
    display: none;
}

@media (orientation: portrait) {
    #rotate {
        display: block;
    }
}
</style>
</head>

<body>

<div id="title">HWTA DESERT WORLD</div>
<div id="info">DESERT REGION | 1500 × 1500</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button class="btn" id="jump">JUMP</button>
<button class="btn" id="run">RUN</button>

<div id="rotate">
    ROTATE YOUR PHONE<br><br>
    يرجى تدوير الهاتف للوضع الأفقي
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// =================================
// GAME ENGINE
// =================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x91b9d0);

scene.fog = new THREE.FogExp2(0xc5a77b, 0.00085);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// =================================
// LIGHTING
// =================================

const sun = new THREE.DirectionalLight(0xffe2b0, 2.5);

sun.position.set(-150, 250, 100);

sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);

const ambient = new THREE.HemisphereLight(
    0xc9e3ff,
    0x806044,
    1.5
);

scene.add(ambient);

// =================================
// MATERIALS
// =================================

const sandMat = new THREE.MeshStandardMaterial({
    color: 0xc9a66b,
    roughness: 1
});

const rockMat = new THREE.MeshStandardMaterial({
    color: 0x927653,
    roughness: 1
});

const buildingMat = new THREE.MeshStandardMaterial({
    color: 0xb18b62,
    roughness: 0.95
});

const militaryMat = new THREE.MeshStandardMaterial({
    color: 0x454c3b,
    roughness: 0.9
});

// =================================
// GROUND
// =================================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1500, 1500),
    sandMat
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);

// =================================
// DESERT ROCKS
// =================================

for (let i = 0; i < 65; i++) {

    const size = 15 + Math.random() * 35;

    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(size, 1),
        rockMat
    );

    rock.position.set(
        (Math.random() - 0.5) * 1350,
        size * 0.35,
        (Math.random() - 0.5) * 1350
    );

    rock.scale.y = 0.45;

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow = true;
    rock.receiveShadow = true;

    scene.add(rock);
}

// =================================
// BUILDINGS
// =================================

const colliders = [];

function building(x, z, w, h, d, material) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, h / 2, z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    colliders.push({
        x,
        z,
        halfX: w / 2,
        halfZ: d / 2
    });

    return mesh;
}

// DESERT VILLAGE

for (let i = 0; i < 15; i++) {

    const x = -200 + Math.random() * 400;
    const z = -200 + Math.random() * 400;

    building(
        x,
        z,
        12 + Math.random() * 10,
        8 + Math.random() * 5,
        12 + Math.random() * 10,
        buildingMat
    );
}

// MILITARY BASE

building(220, 150, 40, 12, 35, militaryMat);

building(275, 150, 25, 9, 25, buildingMat);

building(220, 215, 18, 18, 18, militaryMat);

building(170, 215, 20, 8, 25, buildingMat);

// =================================
// WATCH TOWERS
// =================================

function tower(x, z) {

    building(x, z, 5, 17, 5, militaryMat);

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(11, 3, 11),
        buildingMat
    );

    roof.position.set(x, 19, z);

    roof.castShadow = true;

    scene.add(roof);
}

tower(160, 150);
tower(305, 150);

// =================================
// PLAYER PLACEHOLDER
// سيتم استبداله في الجزء الثاني
// =================================

const player = new THREE.Group();

scene.add(player);

player.position.set(0, 0, 0);

// =================================
// GAME CAMERA
// =================================

let cameraAngle = 0;

const cameraDistance = 8;
const cameraHeight = 4;

function updateCamera() {

    const target = new THREE.Vector3(
        player.position.x,
        player.position.y + 2,
        player.position.z
    );

    camera.position.set(
        player.position.x + Math.sin(cameraAngle) * cameraDistance,
        player.position.y + cameraHeight,
        player.position.z + Math.cos(cameraAngle) * cameraDistance
    );

    camera.lookAt(target);
}

// =================================
// ORIENTATION
// =================================

async function lockLandscape() {

    try {
        await screen.orientation.lock("landscape");
    } catch (e) {
        console.log("Landscape lock not supported");
    }
}

document.addEventListener("click", lockLandscape, {once:true});

// =================================
// RESIZE
// =================================

window.addEventListener("resize", () => {

    camera.aspect = innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);

});

// =================================
// TEMPORARY RENDER
// =================================

updateCamera();

function renderWorld() {

    requestAnimationFrame(renderWorld);

    renderer.render(scene, camera);

}

renderWorld();

</script>

</body>
</html>
