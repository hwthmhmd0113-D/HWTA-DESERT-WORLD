<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HWTA DESERT WORLD V3</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    touch-action: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #b9a078;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#title {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 2px 2px 5px black;
    z-index: 10;
}

#info {
    position: absolute;
    top: 40px;
    left: 12px;
    color: white;
    font-size: 11px;
    text-shadow: 2px 2px 4px black;
    z-index: 10;
}

#joystick {
    position: absolute;
    bottom: 24px;
    left: 24px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #ffffff35;
    border: 2px solid #ffffff90;
    z-index: 20;
}

#stick {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 33px;
    top: 33px;
    border-radius: 50%;
    background: #ffffffdd;
    box-shadow: 0 2px 8px #0008;
}

.btn {
    position: absolute;
    right: 25px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #ffffffbb;
    background: #202820cc;
    color: white;
    font-weight: bold;
    z-index: 20;
}

#jump { bottom: 110px; }
#run { bottom: 25px; }

#help {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 10px;
    text-shadow: 1px 1px 4px black;
    z-index: 10;
}

#rotate {
    display: none;
    position: absolute;
    inset: 0;
    background: #17221b;
    color: white;
    z-index: 100;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 22px;
    line-height: 2;
}

@media (orientation: portrait) {
    #rotate { display: flex; }
}
</style></head><body><div id="title">HWTA DESERT WORLD V3</div>
<div id="info">DESERT REGION | EXPLORATION</div><div id="joystick">
    <div id="stick"></div>
</div><button class="btn" id="jump">JUMP</button>
<button class="btn" id="run">RUN</button>

<div id="help">اسحب الشاشة لتحريك الكاميرا</div><div id="rotate">
    <div>
        HWTA DESERT WORLD<br>
        يرجى تدوير الهاتف للوضع الأفقي
    </div>
</div><script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ENGINE

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x91b9d0);

scene.fog = new THREE.Fog(0xc7ad84, 100, 850);

const camera = new THREE.PerspectiveCamera(
    65, innerWidth / innerHeight, 0.1, 1500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// LIGHTS

const sun = new THREE.DirectionalLight(0xffe4b5, 2.5);

sun.position.set(-100, 180, 100);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);

scene.add(new THREE.HemisphereLight(
    0xd6edff, 0x806044, 1.6
));

// MATERIALS

const sand = new THREE.MeshStandardMaterial({
    color: 0xc7a36e,
    roughness: 1
});

const rock = new THREE.MeshStandardMaterial({
    color: 0x8e7658,
    roughness: 1
});

const wall = new THREE.MeshStandardMaterial({
    color: 0xb69a74,
    roughness: 0.95
});

const green = new THREE.MeshStandardMaterial({
    color: 0x46583b,
    roughness: 0.95
});

const darkGreen = new THREE.MeshStandardMaterial({
    color: 0x29362a,
    roughness: 0.9
});

const skin = new THREE.MeshStandardMaterial({
    color: 0x987052,
    roughness: 0.85
});

const black = new THREE.MeshStandardMaterial({
    color: 0x20231e
});

// GROUND

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1500, 1500),
    sand
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
ground.receiveShadow = true;

scene.add(ground);

// MOUNTAINS

for (let i = 0; i < 35; i++) {

    const size = 35 + Math.random() * 65;
    const height = 60 + Math.random() * 100;

    const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(size, height, 7),
        rock
    );

    mountain.position.set(
        (Math.random() - 0.5) * 1300,
        height / 2 - 3,
        (Math.random() - 0.5) * 1300
    );

    mountain.castShadow = true;
    scene.add(mountain);
}

// DUNES

for (let i = 0; i < 55; i++) {

    const dune = new THREE.Mesh(
        new THREE.SphereGeometry(1, 12, 8),
        sand
    );

    dune.scale.set(
        30 + Math.random() * 40,
        4 + Math.random() * 7,
        25 + Math.random() * 35
    );

    dune.position.set(
        (Math.random() - 0.5) * 1300,
        -3,
        (Math.random() - 0.5) * 1300
    );

    scene.add(dune);
}

// BUILDINGS AND COLLISION

const colliders = [];

function building(x, z, w, h, d, material) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, h / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    colliders.push({
        x, z,
        halfX: w / 2,
        halfZ: d / 2
    });
}

// DESERT VILLAGE

for (let i = 0; i < 15; i++) {

    building(
        -200 + Math.random() * 400,
        -200 + Math.random() * 400,
        12 + Math.random() * 10,
        8 + Math.random() * 5,
        12 + Math.random() * 10,
        wall
    );
}

// MILITARY BASE

building(220, 150, 40, 12, 35, darkGreen);
building(275, 150, 25, 9, 25, wall);
building(220, 215, 18, 18, 18, darkGreen);
building(170, 215, 20, 8, 25, wall);

// SOLDIER MATERIALS

const uniform = new THREE.MeshStandardMaterial({
    color: 0x526341,
    roughness: 0.95
});

const camo1 = new THREE.MeshStandardMaterial({
    color: 0x7c8954
});

const camo2 = new THREE.MeshStandardMaterial({
    color: 0x303e2b
});

const helmetMat = new THREE.MeshStandardMaterial({
    color: 0x3e4d32,
    roughness: 0.8
});

// PLAYER

const player = new THREE.Group();
scene.add(player);

const soldier = new THREE.Group();
player.add(soldier);

function part(parent, geometry, material, x, y, z) {

    const mesh = new THREE.Mesh(geometry, material);

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

// TORSO

const body = new THREE.Group();

body.position.y = 1.65;
soldier.add(body);

part(
    body,
    new THREE.CapsuleGeometry(0.43, 0.75, 5, 12),
    uniform, 0, 0.55, 0
);

// ARMOR VEST

part(
    body,
    new THREE.BoxGeometry(1.05, 0.85, 0.7),
    darkGreen, 0, 0.65, 0.05
);

// POCKETS

for (const x of [-0.36, 0, 0.36]) {

    part(
        body,
        new THREE.BoxGeometry(0.25, 0.28, 0.12),
        uniform, x, 0.7, 0.42
    );
}

// CAMOUFLAGE DETAILS

for (let i = 0; i < 22; i++) {

    part(
        body,
        new THREE.BoxGeometry(
            0.12 + Math.random() * 0.14,
            0.06 + Math.random() * 0.12,
            0.025
        ),
        Math.random() > 0.5 ? camo1 : camo2,
        (Math.random() - 0.5) * 0.8,
        0.2 + Math.random() * 0.9,
        0.36
    );
}

// BELT

part(
    body,
    new THREE.BoxGeometry(0.95, 0.15, 0.65),
    black, 0, 0.05, 0
);

// NECK

part(
    body,
    new THREE.CylinderGeometry(0.13, 0.15, 0.25, 12),
    skin, 0, 1.18, 0
);

// HEAD

const head = new THREE.Group();
head.position.set(0, 1.55, 0);
body.add(head);

part(
    head,
    new THREE.SphereGeometry(0.31, 24, 20),
    skin, 0, 0, 0
);

// EARS

for (const x of [-0.3, 0.3]) {

    part(
        head,
        new THREE.SphereGeometry(0.075, 12, 10),
        skin, x, 0, 0
    );
}

// EYES

const eyes = new THREE.MeshStandardMaterial({
    color: 0x171713
});

for (const x of [-0.12, 0.12]) {

    part(
        head,
        new THREE.SphereGeometry(0.035, 10, 8),
        eyes, x, 0.04, 0.285
    );
}

// NOSE

part(
    head,
    new THREE.ConeGeometry(0.055, 0.13, 8),
    skin, 0, -0.04, 0.30
);

// HELMET

const helmet = part(
    head,
    new THREE.SphereGeometry(0.36, 24, 16),
    helmetMat, 0, 0.2, 0
);

helmet.scale.set(1.12, 0.75, 1.08);

part(
    head,
    new THREE.CylinderGeometry(0.39, 0.39, 0.055, 24),
    darkGreen, 0, 0.08, 0
);

// BACKPACK

part(
    body,
    new THREE.BoxGeometry(0.78, 0.9, 0.35),
    darkGreen, 0, 0.55, -0.48
);

for (const y of [0.25, 0.55, 0.85]) {

    part(
        body,
        new THREE.BoxGeometry(0.58, 0.16, 0.12),
        uniform, 0, y, -0.69
    );
}

// ARMS

const leftArm = new THREE.Group();
const rightArm = new THREE.Group();

leftArm.position.set(-0.66, 0.95, 0);
rightArm.position.set(0.66, 0.95, 0);

body.add(leftArm, rightArm);

function createArm(parent) {

    part(
        parent,
        new THREE.CapsuleGeometry(0.19, 0.55, 5, 10),
        uniform, 0, -0.38, 0
    );

    part(
        parent,
        new THREE.SphereGeometry(0.15, 12, 10),
        black, 0, -0.88, 0
    );
}

createArm(leftArm);
createArm(rightArm);

// LEGS

const leftLeg = new THREE.Group();
const rightLeg = new THREE.Group();

leftLeg.position.set(-0.29, 1.65, 0);
rightLeg.position.set(0.29, 1.65, 0);

soldier.add(leftLeg, rightLeg);

function createLeg(parent) {

    part(
        parent,
        new THREE.CapsuleGeometry(0.23, 0.65, 5, 10),
        uniform, 0, -0.43, 0
    );

    part(
        parent,
        new THREE.BoxGeometry(0.34, 0.24, 0.18),
        darkGreen, 0, -0.82, 0.14
    );

    part(
        parent,
        new THREE.BoxGeometry(0.4, 0.32, 0.62),
        black, 0, -1.05, 0.14
    );
}

createLeg(leftLeg);
createLeg(rightLeg);

// MOVEMENT VARIABLES

let moveX = 0;
let moveY = 0;

let running = false;
let jumping = false;
let verticalSpeed = 0;

let gaitTime = 0;
let cameraAngle = 0;

const cameraDistance = 8;
const cameraHeight = 4;

const velocity = new THREE.Vector3();
const clock = new THREE.Clock();

// JOYSTICK

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;

joystick.addEventListener("pointerdown", e => {

    e.preventDefault();

    joystickActive = true;

    joystick.setPointerCapture(e.pointerId);

    moveJoystick(e);
});

joystick.addEventListener("pointermove", e => {

    if (joystickActive) moveJoystick(e);
});

function moveJoystick(e) {

    const rect = joystick.getBoundingClientRect();

    let x = e.clientX - rect.left - 62.5;
    let y = e.clientY - rect.top - 62.5;

    const length = Math.sqrt(x*x + y*y);

    if (length > 40) {
        x = x / length * 40;
        y = y / length * 40;
    }

    moveX = x / 40;
    moveY = y / 40;

    stick.style.transform =
        `translate(${x}px, ${y}px)`;
}

function stopJoystick() {

    joystickActive = false;

    moveX = 0;
    moveY = 0;

    stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerup", stopJoystick);
joystick.addEventListener("pointercancel", stopJoystick);

// CAMERA TOUCH

let cameraTouch = null;

renderer.domElement.addEventListener("pointerdown", e => {

    cameraTouch = {
        x: e.clientX,
        y: e.clientY
    };
});

renderer.domElement.addEventListener("pointermove", e => {

    if (!cameraTouch) return;

    const dx = e.clientX - cameraTouch.x;

    cameraAngle -= dx * 0.006;

    cameraTouch = {
        x: e.clientX,
        y: e.clientY
    };
});

renderer.domElement.addEventListener("pointerup", () => {
    cameraTouch = null;
});

renderer.domElement.addEventListener("pointercancel", () => {
    cameraTouch = null;
});

// RUN

const runButton = document.getElementById("run");

runButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    running = true;
});

function stopRun() {
    running = false;
}

runButton.addEventListener("pointerup", stopRun);
runButton.addEventListener("pointercancel", stopRun);
runButton.addEventListener("pointerleave", stopRun);

// JUMP

document.getElementById("jump").addEventListener(
    "pointerdown", e => {

        e.preventDefault();

        if (!jumping) {
            verticalSpeed = 7;
            jumping = true;
        }
    }
);

// COLLISION

function collides(x, z) {

    const radius = 0.65;

    for (const box of colliders) {

        const closestX = THREE.MathUtils.clamp(
            x, box.x - box.halfX, box.x + box.halfX
        );

        const closestZ = THREE.MathUtils.clamp(
            z, box.z - box.halfZ, box.z + box.halfZ
        );

        const dx = x - closestX;
        const dz = z - closestZ;

        if (dx*dx + dz*dz < radius*radius) {
            return true;
        }
    }

    return false;
}

// CAMERA

function updateCamera(delta) {

    const target = new THREE.Vector3(
        player.position.x,
        player.position.y + 2,
        player.position.z
    );

    const desired = new THREE.Vector3(
        player.position.x + Math.sin(cameraAngle) * cameraDistance,
        player.position.y + cameraHeight,
        player.position.z + Math.cos(cameraAngle) * cameraDistance
    );

    const smooth = 1 - Math.exp(-8 * delta);

    camera.position.lerp(desired, smooth);
    camera.lookAt(target);
}

// ANIMATION

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.04);

    const forward = -moveY;
    const sideways = moveX;

    const dx =
        sideways * Math.cos(cameraAngle) -
        forward * Math.sin(cameraAngle);

    const dz =
        -sideways * Math.sin(cameraAngle) -
        forward * Math.cos(cameraAngle);

    const walkSpeed = 5;
    const runSpeed = 9;

    const speed = running ? runSpeed : walkSpeed;

    const targetX = dx * speed;
    const targetZ = dz * speed;

    const smooth = 1 - Math.exp(-9 * delta);

    velocity.x += (targetX - velocity.x) * smooth;
    velocity.z += (targetZ - velocity.z) * smooth;

    // COLLISION X

    const nextX = player.position.x + velocity.x * delta;

    if (!collides(nextX, player.position.z)) {
        player.position.x = nextX;
    } else {
        velocity.x = 0;
    }

    // COLLISION Z

    const nextZ = player.position.z + velocity.z * delta;

    if (!collides(player.position.x, nextZ)) {
        player.position.z = nextZ;
    } else {
        velocity.z = 0;
    }

    // WORLD BOUNDS

    player.position.x = THREE.MathUtils.clamp(
        player.position.x, -730, 730
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z, -730, 730
    );

    // PLAYER ROTATION

    const currentSpeed = Math.sqrt(
        velocity.x**2 + velocity.z**2
    );

    const isMoving = currentSpeed > 0.3;

    if (isMoving) {

        const targetRotation = Math.atan2(
            velocity.x, velocity.z
        );

        let difference =
            targetRotation - player.rotation.y;

        difference = Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
        );

        player.rotation.y +=
            difference * Math.min(1, delta * 8);
    }

    // WALK ANIMATION

    if (isMoving) {
        gaitTime += delta * (running ? 13 : 8);
    }

    const movementAmount = Math.min(
        1, currentSpeed / runSpeed
    );

    const swing = isMoving
        ? Math.sin(gaitTime) * movementAmount
        : 0;

    leftLeg.rotation.x = swing * 0.65;
    rightLeg.rotation.x = -swing * 0.65;

    leftArm.rotation.x = -swing * 0.55;
    rightArm.rotation.x = swing * 0.55;

    // BODY BOB

    const bob = isMoving
        ? Math.abs(Math.sin(gaitTime * 2)) * 0.07 * movementAmount
        : 0;

    soldier.position.y = bob;

    const targetLean = running && isMoving ? 0.09 : 0;

    body.rotation.x +=
        (targetLean - body.rotation.x) * smooth;

    // JUMP

    if (jumping) {

        player.position.y += verticalSpeed * delta;

        verticalSpeed -= 19 * delta;

        if (player.position.y <= 0) {

            player.position.y = 0;
            verticalSpeed = 0;
            jumping = false;
        }
    }

    // CAMERA

    updateCamera(delta);

    renderer.render(scene, camera);
}

// INITIAL CAMERA

camera.position.set(0, 4, 8);
camera.lookAt(0, 2, 0);

animate();

// RESIZE

addEventListener("resize", () => {

    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});

</script></body>
    </html>
